<!doctype html>
<html lang="en">
<head>
  <meta name="theme-color" content="#050505">
  <link rel="manifest" href="/manifest.json">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rugby LIVE — Control Panel</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .admin { width:min(980px,100%); margin:auto; padding:24px; }
    h1 { margin:0 0 18px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .panel { background:#111; border:1px solid #262626; border-radius:20px; padding:20px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    input, button {
      font:inherit; border-radius:12px; border:1px solid #333; padding:12px 14px;
    }
    input { background:#080808; color:white; }
    button { background:white; color:black; font-weight:800; cursor:pointer; }
    button.red { background:#ff453a; color:white; }
    button.green { background:#35ff25; color:#001b00; }
    .bigscore { font-size:72px; color:#35ff25; font-weight:900; margin:8px 0 16px; }
    label { display:block; color:#aaa; margin-bottom:6px; }
    .pin { max-width:150px; }
    .preview { color:#aaa; font-size:14px; margin-top:8px; }
    a { color:white; }
    @media(max-width:720px){
      .grid{grid-template-columns:1fr;}
      .admin{padding:14px;}
      .panel{padding:16px;}
      button{min-height:44px; min-width:58px; font-size:18px;}
      .row{gap:8px;}
      .bigscore{font-size:52px;}
      #clock{font-size:36px !important;}
     .clock-controls{display:flex;align-items:center;flex-wrap:nowrap;gap:8px;}
      .clock-controls button{
  min-width:0;
  font-size:16px;
  padding:8px 10px;      
}
      h1{font-size:28px;}
      input{width:100%; font-size:22px; padding:16px;}
      .pin{width:45%;max-width:45%;}
      .top-controls{
  display:flex;
  flex-wrap:nowrap;
  align-items:center;
  gap:8px;
}
      .top-controls .pin{width:45%;max-width:45%;}
      .top-controls .public-live-btn{
  flex:1;
  width:auto;
  min-width:0;
  min-height:44px;
  align-items:center;
  justify-content:center;
  text-align:center;
}
      #startLive,#endMatch, #copyLiveLink {
  min-height:40px;
  font-size:16px;
  padding:8px 12px;
}
      .live-actions{
  display:flex;
  flex-wrap:nowrap;
  gap:6px;
}
      .live-actions button{
  flex:1;
}
      .live-actions button{
  min-width:0;
  font-size:13px;
  padding:8px 7px;
}
      .public-live-btn{
  display:flex;
  font-size:14px;
  font-weight:800;
  padding:10px 8px;
  border:2px solid #35ff25;
  border-radius:12px;
  text-decoration:none;
white-space:nowrap;
}
      .admin-top-panel{display:block;}
      #adminProtected{position:static; display:block; width:100%; margin-top:10px;}
      #adminProtected .live-actions{position:static;}
      #adminProtected .preview{position:static;}
    }
  </style>
</head>
<body>
<datalist id="teamSuggestions"><option value="Sleaford"></option></datalist>
<div class="admin">
  <h1>Rugby LIVE — Control Panel</h1>

  <div class="panel admin-top-panel" style="margin-bottom:18px">
    <div class="row top-controls">
      <input id="pin" class="pin" type="password" placeholder="Admin PIN" value="" />
      <a id="publicLiveLink" href="/live.html?team=U13" target="_blank" class="public-live-btn">Open LIVE page ↗</a>
    </div>
    <div id="adminProtected">
    <div class="row live-actions">
      <button id="startLiveBtn" class="green" onclick="toggleLive()">Start LIVE</button>
      <button id="endMatch" class="red" onclick="act('endMatch',{message:'Full Time'})">End Match</button>
      <button id="copyLiveLink" type="button" onclick="copyLiveLink()">📋 Copy LIVE Link</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="generateControlPin" type="button" onclick="generateMatchControlPin()">Generate Match Control PIN</button>
      <button id="copyControlAccess" type="button" onclick="copyMatchControlAccess()" style="display:none">📋 Copy PIN + Link</button>
      <button id="revokeControl" type="button" class="red" onclick="revokeMatchControl()">Revoke Access</button>
      <a id="matchControlLink" href="/match-control.html" target="_blank" class="public-live-btn">Open Match Control ↗</a>
    </div>
    <div id="controlPinPreview" class="preview"></div>
    <div class="preview">The public link is always the main server address.</div>
  </div>
  </div>

  <div class="grid">
    <section class="panel">
      <label>Home Team</label>
      <input id="homeName" value="Team 1" list="teamSuggestions" />
      <div class="bigscore" id="homeScore">0</div>
      <div class="row">
        <button onclick="score('home',1)">+1</button>
        <button onclick="score('home',2)">+2</button>
        <button onclick="score('home',3)">+3</button>
        <button onclick="score('home',5)">+5</button>
        <button onclick="score('home',-1)">−1</button>
      </div>
    </section>

    <section class="panel">
      <label>Away Team</label>
      <input id="awayName" value="Team 2" list="teamSuggestions" />
      <div class="bigscore" id="awayScore">0</div>
      <div class="row">
        <button onclick="score('away',1)">+1</button>
        <button onclick="score('away',2)">+2</button>
        <button onclick="score('away',3)">+3</button>
        <button onclick="score('away',5)">+5</button>
        <button onclick="score('away',-1)">−1</button>
      </div>
    </section>

    <section class="panel clock-panel">
      <label>Match Clock</label>
      
      <div class="row clock-controls">
        <button onclick="act('toggleClock')" id="clockBtn">Start Clock</button>
        <div class="clock" id="clock">40:00</div>
        <button onclick="act('resetClock')">Reset Time</button>
      </div>
    </section>

    <section class="panel">
      <label>Half</label>
      <div class="row">
        <button id="half1Btn" onclick="act('setHalf',{half:1})">1st Half</button>
        <button id="half2Btn" onclick="act('setHalf',{half:2})">2nd Half</button>
      </div>
      <br>
      <button class="green" onclick="newMatch()">New Match / 0:0</button>
    </section>
<section class="panel">
  <label>Age Group</label>
  <div class="row">
    <button id="ageU13" onclick="act('setAgeGroup',{ageGroup:'U13'})">U13</button>
    <button id="ageU14" onclick="act('setAgeGroup',{ageGroup:'U14'})">U14</button>
    <button id="ageU15" onclick="act('setAgeGroup',{ageGroup:'U15'})">U15</button>
    <button id="ageU16" onclick="act('setAgeGroup',{ageGroup:'U16'})">U16</button>
    <button id="ageColts" onclick="act('setAgeGroup',{ageGroup:'Colts'})">Colts</button>
    <button id="age1stXV" onclick="act('setAgeGroup',{ageGroup:'1st XV'})">1st XV</button>
    <button id="age2ndXV" onclick="act('setAgeGroup',{ageGroup:'2nd XV'})">2nd XV</button>
  </div>
</section>
<section class="panel">
  <label>Match Type</label>
  <div class="row">
    <button id="matchFriendly" onclick="act('setMatchType',{matchType:'Friendly'})">Friendly</button>
    <button id="matchNLD" onclick="act('setMatchType',{matchType:'NLD'})">NLD</button>
  </div>
</section>
    <section class="panel">
  <label>Next Live</label>
  <div class="row">
    <input id="nextHome" placeholder="Next Home Team">
    <input id="nextAway" placeholder="Next Away Team">
    <input id="nextAge" placeholder="Age Group, e.g. U14">
    <button id="nextFriendly" type="button" onclick="setNextType('Friendly')">FRIENDLY</button>
<button id="nextNLD" type="button" onclick="setNextType('NLD')">NLD</button>
    <input id="nextLive" placeholder="e.g. Today 14:30">
    <button onclick="act('setNextLive',{nextHome:$('nextHome').value,nextAway:$('nextAway').value,nextAge:$('nextAge').value,nextType:nextTypeSelected,nextLive:$('nextLive').value})">Save Next Live</button>
  </div>
</section>
  </div>
</div>
<section class="panel">
  <label>Add Current Season Result</label>
  <div class="row">
    <input id="seasonHome" placeholder="Home Team" list="teamSuggestions">
    <input id="seasonHomeScore" type="number" min="0" placeholder="Home Score">
    <input id="seasonAwayScore" type="number" min="0" placeholder="Away Score">
    <input id="seasonAway" placeholder="Away Team" list="teamSuggestions">
    <button id="seasonFriendly" type="button" class="green" onclick="setSeasonType('Friendly')">FRIENDLY</button>
    <button id="seasonNLD" type="button" onclick="setSeasonType('NLD')">NLD</button>
    <button type="button" onclick="addSeasonResult()">Add for Review</button>
  </div>
  <div class="preview">Adds to Pending Results first. It will not affect W/D/L until confirmed.</div>
</section>
<section class="panel">
  <label>Current Season — Pending Results</label>
  <div class="row"><button type="button" onclick="loadPendingResults()">Refresh Pending Results</button></div>
  <div id="pendingResults" class="preview" style="margin-top:12px">Enter Admin PIN and refresh.</div>
</section>
<section class="panel">
  <label>NLD Match History</label>
  <div class="row">
    <input id="historyGeneration" placeholder="Generation, e.g. 2013">
    <input id="historyOpponent" placeholder="Opponent">
    <input id="historyWins" type="number" min="0" value="0" placeholder="Wins">
<input id="historyDraws" type="number" min="0" value="0" placeholder="Draws">
<input id="historyLosses" type="number" min="0" value="0" placeholder="Losses">
    <button type="button" onclick="addHistory()">Add NLD History</button>
  </div>
</section>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
let generatedControlPin = '';
async function loadTeamSuggestions(){
  try{
    const r=await fetch('/api/opponents');
    const names=await r.json();
    if(!r.ok)return;
    const all=['Sleaford',...names.filter(n=>String(n).toLowerCase()!=='sleaford')];
    $('teamSuggestions').innerHTML=all.map(n=>'<option value="'+String(n).replace(/"/g,'&quot;')+'"></option>').join('');
  }catch(e){}
}

async function generateMatchControlPin() {
  const r = await fetch('/api/match-control/generate', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pin:$('pin').value, team:selectedTeam})
  });
  const data = await r.json();
  if (!r.ok) return alert(data.error || 'Could not generate PIN');
  generatedControlPin = data.controlPin;
  $('controlPinPreview').textContent = selectedTeam + ' Match Control PIN: ' + generatedControlPin + ' (one-time)';
  $('copyControlAccess').style.display = '';
}

async function copyMatchControlAccess() {
  if (!generatedControlPin) return;
  const text = 'Rugby LIVE — ' + selectedTeam + '\n' +
    window.location.origin + '/match-control.html\nPIN: ' + generatedControlPin;
  await navigator.clipboard.writeText(text);
  $('copyControlAccess').textContent = '✓ Copied!';
  setTimeout(() => $('copyControlAccess').textContent = '📋 Copy PIN + Link', 2000);
}

async function revokeMatchControl() {
  if (!confirm('Revoke Match Control access for ' + selectedTeam + '?')) return;
  const r = await fetch('/api/match-control/revoke', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pin:$('pin').value, team:selectedTeam})
  });
  const data = await r.json();
  if (!r.ok) return alert(data.error || 'Could not revoke access');
  generatedControlPin = '';
  $('controlPinPreview').textContent = selectedTeam + ' Match Control access revoked';
  $('copyControlAccess').style.display = 'none';
}

  async function copyLiveLink() {
      const liveUrl = window.location.origin + '/live.html?team=' + encodeURIComponent(selectedTeam);
      await navigator.clipboard.writeText(liveUrl);
    const btn = document.getElementById('copyLiveLink');
    btn.textContent = '✓ Link Copied!';
    setTimeout(() => {
      btn.textContent = '📋 Copy LIVE Link';
      }, 2000);
    }

let seasonTypeSelected='Friendly';
function setSeasonType(type){
  seasonTypeSelected=type;
  $('seasonFriendly').className=type==='Friendly'?'green':'';
  $('seasonNLD').className=type==='NLD'?'green':'';
}
async function addSeasonResult(){
  const payload={pin:$('pin').value,team:selectedTeam,homeName:$('seasonHome').value,awayName:$('seasonAway').value,homeScore:Number($('seasonHomeScore').value),awayScore:Number($('seasonAwayScore').value),matchType:seasonTypeSelected};
  if(!payload.homeName.trim()||!payload.awayName.trim()) return alert('Enter both team names');
  if(!confirm('Add '+payload.homeName+' '+payload.homeScore+'–'+payload.awayScore+' '+payload.awayName+' to Pending Results?')) return;
  const r=await fetch('/api/results/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const d=await r.json(); if(!r.ok)return alert(d.error||'Could not add result');
  $('seasonHome').value=''; $('seasonAway').value=''; $('seasonHomeScore').value=''; $('seasonAwayScore').value='';
  loadPendingResults();
}
async function loadPendingResults(){
  const r=await fetch('/api/pending-results?team='+encodeURIComponent(selectedTeam)+'&pin='+encodeURIComponent($('pin').value));
  const rows=await r.json();
  if(!r.ok) return alert(rows.error||'Could not load pending results');
  $('pendingResults').innerHTML=rows.length?rows.map(m=>'<div style="padding:10px 0;border-bottom:1px solid #333"><b>'+m.home_name+' '+m.home_score+'–'+m.away_score+' '+m.away_name+'</b> · '+m.match_type+'<br><button onclick="editPending('+m.id+',\''+String(m.home_name).replace(/'/g,"\\'")+'\',\''+String(m.away_name).replace(/'/g,"\\'")+'\','+m.home_score+','+m.away_score+',\''+String(m.match_type).replace(/'/g,"\\'")+'\')">Edit</button> <button class="red" onclick="discardPending('+m.id+')">Discard</button> <button class="green" onclick="confirmPending('+m.id+')">Confirm Result</button></div>').join(''):'No pending results';
}
async function discardPending(id){
  if(!confirm('Discard this pending result? This cannot be undone.')) return;
  const r=await fetch('/api/results/discard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value,id})});
  const d=await r.json(); if(!r.ok)return alert(d.error||'Could not discard'); loadPendingResults();
}
async function confirmPending(id){
  if(!confirm('Confirm this result and add it to season statistics?')) return;
  const r=await fetch('/api/results/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value,id})});
  const d=await r.json(); if(!r.ok)return alert(d.error||'Could not confirm'); loadPendingResults();
}
async function editPending(id,homeName,awayName,homeScore,awayScore,matchType){
  const hs=prompt('Home score',homeScore); if(hs===null)return;
  const as=prompt('Away score',awayScore); if(as===null)return;
  const hn=prompt('Home team',homeName); if(hn===null)return;
  const an=prompt('Away team',awayName); if(an===null)return;
  const mt=prompt('Match type',matchType); if(mt===null)return;
  const r=await fetch('/api/results/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value,id,homeName:hn,awayName:an,homeScore:Number(hs),awayScore:Number(as),matchType:mt})});
  const d=await r.json(); if(!r.ok)return alert(d.error||'Could not edit'); loadPendingResults();
}

  async function addHistory() {
  const generation = $('historyGeneration').value.trim();
  const opponent = $('historyOpponent').value.trim();
  const wins = Number($('historyWins').value) || 0;
  const draws = Number($('historyDraws').value) || 0;
  const losses = Number($('historyLosses').value) || 0;

  if (!generation || !opponent) {
    alert('Enter generation and opponent');
    return;
  }

  const response = await fetch('/api/history', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ generation, opponent, wins, draws, losses })
  });

  if (!response.ok) {
    alert('Could not save history');
    return;
  }

  alert('NLD history saved');
}
const $ = id => document.getElementById(id);
loadTeamSuggestions();
const adminProtected = $('adminProtected');
adminProtected.style.display = 'none';
$('pin').addEventListener('input', () => {
  adminProtected.style.display = $('pin').value.trim() ? '' : 'none';
});
let selectedTeam = new URLSearchParams(window.location.search).get('team') || 'U13';
let socket;
let last = null;
  let nextLiveLoaded = false;
  let nextTypeSelected = 'Friendly';
  function setNextType(type) {
  nextTypeSelected = type;
  $('nextFriendly').className = type === 'Friendly' ? 'green' : '';
  $('nextNLD').className = type === 'NLD' ? 'green' : '';
}

function fmt(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
}

function render(s) {
  if (!nextLiveLoaded) {
    $('nextHome').value = s.nextHome || '';
    $('nextAway').value = s.nextAway || '';
    $('nextAge').value = s.nextAge || '';
    $('nextLive').value = s.nextLive || '';
    nextLiveLoaded = true;
    }
  last = s;
  $('startLiveBtn').className = s.matchLive ? 'red' : 'green';
  $('startLiveBtn').textContent = s.matchLive ? 'Stop LIVE' : 'Start LIVE';
  $('homeScore').textContent = s.homeScore;
  $('awayScore').textContent = s.awayScore;
  $('clock').textContent = fmt(s.remainingSeconds);
  if (document.activeElement !== $('homeName')) $('homeName').value = s.homeName;
  if (document.activeElement !== $('awayName')) $('awayName').value = s.awayName;
  if (document.activeElement !== $('nextFriendly') && document.activeElement !== $('nextNLD')) {
  nextTypeSelected = s.nextType || 'Friendly';
}
  $('nextFriendly').className = nextTypeSelected === 'Friendly' ? 'green' : '';
  $('nextNLD').className = nextTypeSelected === 'NLD' ? 'green' : '';
  $('clockBtn').textContent = s.running ? 'Stop Clock' : 'Start Clock';
  $('half1Btn').className = s.half === 1 ? 'green' : '';
  $('half2Btn').className = s.half === 2 ? 'green' : '';
  ['U13','U14','U15','U16','Colts','1st XV','2nd XV'].forEach(g => { $(g === 'Colts' ? 'ageColts' : g === '1st XV' ? 'age1stXV' : g === '2nd XV' ? 'age2ndXV' : 'age' + g).className = s.ageGroup === g ? 'green' : ''; });
$('matchFriendly').className = s.matchType === 'Friendly' ? 'green' : '';
$('matchNLD').className = s.matchType === 'NLD' ? 'green' : '';}

function selectTeam(team) {
  selectedTeam = team;
  const url = new URL(window.location.href);
  url.searchParams.set('team', team);
  history.replaceState(null, '', url);
  const link = $('publicLiveLink');
  if (link) link.href = '/live.html?team=' + encodeURIComponent(team);
  const controlLink = $('matchControlLink');
  if (controlLink) controlLink.href = '/match-control.html';
  $('controlPinPreview').textContent = '';
  $('copyControlAccess').style.display = 'none';
  nextLiveLoaded = false;
  if (socket) socket.emit('selectTeam', team);
  fetch('/api/state?team=' + encodeURIComponent(team)).then(r=>r.json()).then(render);
}

function toggleLive() {
  act(last?.matchLive ? 'stopLive' : 'startMatch');
}

async function act(action,payload={}) {
  if (action === 'setAgeGroup') {
    selectTeam(payload.ageGroup);
  }
  const r = await fetch('/api/admin', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pin:$('pin').value,action,payload,team:selectedTeam})
  });
  const data = await r.json();
  if(!r.ok) alert(data.error || 'Error');
}

function score(team,delta){ act('score',{team,delta}); }

function newMatch(){
  act('newMatch',{
    homeName:$('homeName').value,
    awayName:$('awayName').value
  });
}

let nameTimer;
function saveNames(){
  clearTimeout(nameTimer);
  nameTimer=setTimeout(()=>act('setNames',{
    homeName:$('homeName').value,
    awayName:$('awayName').value
  }),400);
}

$('homeName').addEventListener('input',saveNames);
$('awayName').addEventListener('input',saveNames);

$('publicLiveLink').href = '/live.html?team=' + encodeURIComponent(selectedTeam);
$('matchControlLink').href = '/match-control.html';

fetch('/api/state?team=' + encodeURIComponent(selectedTeam))
  .then(r=>r.json())
  .then(render);

socket = io({ query: { team: selectedTeam } });
socket.on('state',render);
</script>
</body>
</html>
