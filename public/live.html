<!doctype html>
<html lang="en">
<head>
  <meta property="og:title" content="Rugby LIVE">
  <meta property="og:description" content="Live rugby scores. Fast. Simple. Always LIVE.">
  <meta property="og:url" content="https://rugby-live-score.onrender.com/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://rugby-live-score.onrender.com/LIVE%20VIDEO.png">
  <meta name="theme-color" content="#050505">
  <link rel="manifest" href="/live-manifest.json">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rugby LIVE</title>
  <link rel="stylesheet" href="/style.css" />
<style>
/* Compact season W/D/L preview. Data connection comes in the next step. */
.season-mini{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:10px;
  white-space:nowrap;
  font-size:14px;
  font-weight:800;
  letter-spacing:.5px;
}
.season-label{color:#aaa;font-size:11px;letter-spacing:1px;}
.season-stat strong{font-size:16px;}
.full-stats-hint{margin-top:7px;text-align:center;font-size:10px;font-weight:800;letter-spacing:1px;color:#888;cursor:pointer;user-select:none;}
.stats-screen{
  position:fixed;inset:0;z-index:30;background:#050505;color:#fff;
  transform:translateX(100%);transition:transform .32s ease;
  display:flex;align-items:center;justify-content:center;padding:80px 24px 50px;box-sizing:border-box;
}
body.stats-open .stats-screen{transform:translateX(0);}
.stats-panel{width:min(620px,100%);text-align:center;}
.stats-age{font-size:58px;font-weight:900;color:#ffd400;line-height:1;}
.stats-club{font-size:22px;font-weight:900;margin-top:8px;}
.stats-season{font-size:14px;color:#aaa;font-weight:800;letter-spacing:1px;margin-top:6px;}
.stats-rule{height:1px;background:#555;width:210px;margin:18px auto;}
.stats-played-label,.stats-history-title{font-size:12px;color:#aaa;font-weight:800;letter-spacing:1px;}
.stats-played{font-size:42px;font-weight:900;margin:2px 0 14px;}
.stats-wdl{display:flex;justify-content:center;gap:28px;font-size:24px;font-weight:900;}
.stats-points{margin-top:22px;font-size:16px;font-weight:800;}
.stats-history{margin-top:28px;}
.stats-empty{margin-top:10px;color:#888;font-size:14px;}
.live-score-hint{margin-top:34px;font-size:11px;font-weight:800;letter-spacing:1px;color:#888;cursor:pointer;user-select:none;}
@media(max-width:700px){
  .season-mini{gap:12px;margin-top:9px;font-size:18px;}
  .season-label{font-size:14px;}
  .season-stat strong{font-size:21px;}
  .full-stats-hint{position:fixed;left:0;right:0;bottom:28px;margin:0;text-align:center;font-size:14px;z-index:12;}
  .stats-screen{padding:90px 22px 40px;}
  .stats-age{font-size:46px;}
  .stats-club{font-size:20px;}
  .stats-played{font-size:36px;}
  .stats-wdl{font-size:21px;gap:22px;}
}
</style>
</head>
<body>
  <div class="broadcast">
  <div class="broadcast-text">
    <span>Broadcast</span>
    <strong>Andris Sudmalis</strong>
  </div>
</div>
  <div class="live-status-wrap">
    <div class="live-corner" id="liveCorner"><img src="/age-group-live-icon.png" alt="LIVE"></div>
    <div id="matchViewers">👁 <span id="viewerCount">0</span> WATCHING</div>
  </div>
<div class="stats-screen" id="statsScreen">
  <div class="stats-panel">
    <div class="stats-age" id="statsAge">U13's</div>
    <div class="stats-club">SLEAFORD RUGBY</div>
    <div class="stats-season">FULL STATS</div>
    <div class="stats-rule"></div>
    <div class="stats-played-label">PLAYED</div>
    <div class="stats-played">0</div>
    <div class="stats-wdl"><span>W 0</span><span>D 0</span><span>L 0</span></div>
    <div class="stats-points">POINTS&nbsp;&nbsp; FOR 0 &nbsp;·&nbsp; AGAINST 0</div>
    <div class="stats-history">
      <div class="stats-history-title">MATCH HISTORY</div>
      <div class="stats-empty">No matches played yet</div>
    </div>
    <div class="live-score-hint" id="closeStats">LIVE SCORE ›</div>
  </div>
</div>
<div class="wrap">
  <main class="card">
    

    <section class="board">
      <div class="center-info">
  <div class="vs" id="ageGroup">U13</div>
  <div class="match-type" id="matchType">Friendly</div>
        <div class="center-line"></div>
        <div class="top">
  <div class="clock" id="clock">40:00</div>
  <div class="half"><span id="half">1</span><span id="halfSuffix">st</span><span id="halfWord"> Half</span></div>
          <div class="center-line"></div>
          <div class="season-mini" aria-label="Sleaford season record">
            <span class="season-label">SEASON</span>
            <span class="season-stat season-win">W <strong id="seasonWins">0</strong></span>
            <span class="season-stat season-draw">D <strong id="seasonDraws">0</strong></span>
            <span class="season-stat season-loss">L <strong id="seasonLosses">0</strong></span>
          </div>
          <div class="full-stats-hint" id="openStats">‹ SWIPE FOR FULL STATS</div>
</div>
        </div>
      <div class="team">
        <div class="name" id="homeName">Team 1</div>
        <div class="score" id="homeScore">0</div>
      </div>
      

      <div class="team">
        <div class="name" id="awayName">Team 2</div>
        <div class="score" id="awayScore">0</div>
      </div>
    </section>

  <div id="nextLiveBox" class="next-live"></div></main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);

function fmt(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
}

function render(s) {
  $('homeName').textContent = s.homeName;
  $('awayName').textContent = s.awayName;
  $('homeScore').textContent = s.homeScore;
  $('awayScore').textContent = s.awayScore;
  $('half').textContent = s.matchLive ? s.half : 'Full Time';
  $('halfSuffix').textContent = s.matchLive ? (s.half === 1 ? 'st' : 'nd') : '';
  $('halfWord').textContent = s.matchLive ? ' Half' : '';
  $('clock').textContent = fmt(s.remainingSeconds);
  const age = s.ageGroup || 'U13';
$('ageGroup').textContent = ['U13','U14','U15','U16'].includes(age) ? age + "'s" : age;
$('statsAge').textContent = ['U13','U14','U15','U16'].includes(age) ? age + "'s" : age;
$('matchType').textContent = (s.matchType || 'Friendly').toUpperCase() + ' GAME';
  $('liveCorner').style.display = s.matchLive ? 'block' : 'none';
 $('nextLiveBox').innerHTML = (s.nextLive)
  ? '<div class="next-title">Planned LIVE:</div>' +
    '<div class="next-card">' +
      '<div class="next-icon">🗓️</div>' +
      '<div>' +
        '<div class="next-teams">' + s.nextHome + ' vs ' + s.nextAway + '</div>' +
        '<div class="next-details">' + (['U13','U14','U15','U16'].includes(s.nextAge) ? s.nextAge + "'s" : s.nextAge) + ' ' + (s.nextType || 'Friendly').toUpperCase() + ' GAME</div>' +
        '<div class="next-time">' + s.nextLive + '</div>' +
   '<div class="next-note">Subject to availability</div>' +
      '</div>' +
    '</div>'
  : '';
}

function openStats(){ document.body.classList.add('stats-open'); }
function closeStats(){ document.body.classList.remove('stats-open'); }
$('openStats').addEventListener('click', openStats);
$('closeStats').addEventListener('click', closeStats);

let touchStartX = 0;
let touchStartY = 0;
document.addEventListener('touchstart', e => {
  if (!e.touches.length) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', e => {
  if (!e.changedTouches.length) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy)) return;
  if (dx < 0) openStats();
  if (dx > 0) closeStats();
}, {passive:true});

const params = new URLSearchParams(location.search);
const selectedTeam = params.get('team') || 'U13';

fetch('/api/state?team=' + encodeURIComponent(selectedTeam))
  .then(r => r.json())
  .then(render);

const socket = io({ query: { team: selectedTeam, role: 'viewer' } });
socket.on('viewerCount', count => { $('viewerCount').textContent = Number(count || 0); });
socket.on('state', render);
</script>
</body>
</html>
