<!doctype html>
<html lang="en">
<head>
  <meta property="og:title" content="Rugby LIVE">
  <meta property="og:description" content="Live rugby scores. Fast. Simple. Always LIVE.">
  <meta property="og:url" content="https://rugby-live-score.onrender.com/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://rugby-live-score.onrender.com/LIVE%20VIDEO.png">
  <meta name="theme-color" content="#050505">
  <link rel="manifest" href="/live-manifest.json">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rugby LIVE</title>
  <link rel="stylesheet" href="/style.css" />
<style>
/* Compact season W/D/L preview. Data connection comes in the next step. */
.season-mini{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:10px;
  white-space:nowrap;
  font-size:14px;
  font-weight:800;
  letter-spacing:.5px;
}
.season-label{color:#aaa;font-size:11px;letter-spacing:1px;}
.season-stat strong{font-size:16px;}
@media(max-width:700px){
  .season-mini{gap:7px;margin-top:7px;font-size:11px;}
  .season-label{font-size:9px;}
  .season-stat strong{font-size:13px;}
}
</style>
</head>
<body>
  <div class="broadcast">
  <div class="broadcast-text">
    <span>Broadcast</span>
    <strong>Andris Sudmalis</strong>
  </div>
</div>
  <div class="live-status-wrap">
    <div class="live-corner" id="liveCorner"><img src="/age-group-live-icon.png" alt="LIVE"></div>
    <div id="matchViewers">👁 <span id="viewerCount">0</span> WATCHING</div>
  </div>
<div class="wrap">
  <main class="card">
    

    <section class="board">
      <div class="center-info">
  <div class="vs" id="ageGroup">U13</div>
  <div class="match-type" id="matchType">Friendly</div>
        <div class="center-line"></div>
        <div class="top">
  <div class="clock" id="clock">40:00</div>
  <div class="half"><span id="half">1</span><span id="halfSuffix">st</span><span id="halfWord"> Half</span></div>
          <div class="center-line"></div>
          <div class="season-mini" aria-label="Sleaford season record">
            <span class="season-label">SEASON</span>
            <span class="season-stat season-win">W <strong id="seasonWins">0</strong></span>
            <span class="season-stat season-draw">D <strong id="seasonDraws">0</strong></span>
            <span class="season-stat season-loss">L <strong id="seasonLosses">0</strong></span>
          </div>
</div>
        </div>
      <div class="team">
        <div class="name" id="homeName">Team 1</div>
        <div class="score" id="homeScore">0</div>
      </div>
      

      <div class="team">
        <div class="name" id="awayName">Team 2</div>
        <div class="score" id="awayScore">0</div>
      </div>
    </section>

  <div id="nextLiveBox" class="next-live"></div></main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);

function fmt(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
}

function render(s) {
  $('homeName').textContent = s.homeName;
  $('awayName').textContent = s.awayName;
  $('homeScore').textContent = s.homeScore;
  $('awayScore').textContent = s.awayScore;
  $('half').textContent = s.matchLive ? s.half : 'Full Time';
  $('halfSuffix').textContent = s.matchLive ? (s.half === 1 ? 'st' : 'nd') : '';
  $('halfWord').textContent = s.matchLive ? ' Half' : '';
  $('clock').textContent = fmt(s.remainingSeconds);
  const age = s.ageGroup || 'U13';
$('ageGroup').textContent = ['U13','U14','U15','U16'].includes(age) ? age + "'s" : age;
$('matchType').textContent = (s.matchType || 'Friendly').toUpperCase() + ' GAME';
  $('liveCorner').style.display = s.matchLive ? 'block' : 'none';
 $('nextLiveBox').innerHTML = (s.nextLive)
  ? '<div class="next-title">Planned LIVE:</div>' +
    '<div class="next-card">' +
      '<div class="next-icon">🗓️</div>' +
      '<div>' +
        '<div class="next-teams">' + s.nextHome + ' vs ' + s.nextAway + '</div>' +
        '<div class="next-details">' + (['U13','U14','U15','U16'].includes(s.nextAge) ? s.nextAge + "'s" : s.nextAge) + ' ' + (s.nextType || 'Friendly').toUpperCase() + ' GAME</div>' +
        '<div class="next-time">' + s.nextLive + '</div>' +
   '<div class="next-note">Subject to availability</div>' +
      '</div>' +
    '</div>'
  : '';
}

const params = new URLSearchParams(location.search);
const selectedTeam = params.get('team') || 'U13';

fetch('/api/state?team=' + encodeURIComponent(selectedTeam))
  .then(r => r.json())
  .then(render);

const socket = io({ query: { team: selectedTeam, role: 'viewer' } });
socket.on('viewerCount', count => { $('viewerCount').textContent = Number(count || 0); });
socket.on('state', render);
</script>
</body>
</html>
