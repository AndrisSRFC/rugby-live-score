<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rugby LIVE Score</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .home-screen {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,.78) 0%,
          rgba(0,0,0,.28) 48%,
          rgba(0,0,0,.45) 100%
        ),
        url("/broadcast-ball.png.png") center center / cover no-repeat;
    }

    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 22px 26px;
    }

    .live-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu {
      font-size: 30px;
      line-height: 1;
      margin-right: 8px;
    }

    .live-badge {
      background: #ff1616;
      color: white;
      font-weight: 900;
      font-size: 18px;
      padding: 9px 17px;
      border-radius: 7px;
      box-shadow: 0 0 20px rgba(255,0,0,.45);
    }

    .watching {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    .watching .eye {
      margin-right: 5px;
    }

    .broadcast {
      text-align: right;
      line-height: 1.1;
      text-shadow: 0 2px 8px black;
    }

    .broadcast-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .broadcast-name {
      margin-top: 5px;
      font-size: 18px;
      font-weight: 800;
      font-style: italic;
    }

    .broadcast-line {
      width: 130px;
      height: 3px;
      margin: 7px 0 0 auto;
      background: #e21c23;
    }

    .content {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      align-items: center;
      padding: 20px 7vw 120px;
    }

    .title {
      margin: 0;
      font-size: clamp(46px, 7vw, 94px);
      line-height: .84;
      font-weight: 1000;
      font-style: italic;
      letter-spacing: -3px;
      text-transform: uppercase;
      text-shadow: 0 5px 15px rgba(0,0,0,.9);
      transform: rotate(-3deg);
    }

    .title span {
      display: block;
      color: #39ff14;
      margin-left: 45px;
    }

    .bottom {
      position: relative;
      z-index: 3;
      padding: 0 20px 22px;
    }

    .age-groups {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      max-width: 1050px;
      margin: 0 auto 18px;
    }

    .age-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 10px 6px;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 900;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 8px;
      background: rgba(0,0,0,.28);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      text-shadow: 0 2px 5px black;
    }

    .age-btn.live {
      color: #39ff14;
      border: 2px solid #39ff14;
      background: rgba(20,70,15,.28);
      box-shadow:
        0 0 8px #39ff14,
        inset 0 0 10px rgba(57,255,20,.18);
    }

    .install-wrap {
      width: 100%;
      text-align: center;
    }
    .bottom-space {
  height: 60px;
}

    #installApp {
      width: 100%;
      border: 1px solid #39ff14;
      border-radius: 25px;
      padding: 11px 25px;
      background: rgba(0,0,0,.48);
      color: #39ff14;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 0 10px rgba(57,255,20,.35);
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .topbar {
        padding: 16px 14px;
      }

      .menu {
        font-size: 25px;
        margin-right: 2px;
      }

      .live-area {
        gap: 8px;
      }

      .live-badge {
        font-size: 14px;
        padding: 7px 11px;
      }

      .watching {
        font-size: 11px;
      }

      .broadcast-title,
      .broadcast-name {
        font-size: 13px;
      }

      .broadcast-line {
        width: 95px;
      }

      .content {
  align-items: flex-start;
  padding: 18vh 18px 20px;
}

.home-screen {
  background-size: auto 76%;
  background-position: center 40%;
  background-repeat: no-repeat;
}

      .title {
        font-size: clamp(43px, 14vw, 68px);
      }

      .title span {
        margin-left: 25px;
      }

      .bottom {
        padding: 0 10px 8px;
      }

      .age-groups {
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }

      .age-btn {
        min-height: 44px;
        font-size: 14px;
      }
      #installApp {
  width: 100%;
  margin-top: 8px;
  padding: 14px 20px;
}
    }
  </style>
</head>

<body>

  <main class="home-screen">

    <div class="topbar">

      <div class="live-area">
        <div class="menu">☰</div>
        <div class="live-badge">LIVE</div>

        <div class="watching">
          <span class="eye">👁</span>
          <span id="totalViewers">0</span> WATCHING NOW
        </div>
      </div>

      <div class="broadcast">
        <div class="broadcast-title">Broadcast</div>
        <div class="broadcast-name">Andris Sudmalis</div>
        <div class="broadcast-line"></div>
      </div>

    </div>

    <div class="content">
      <h1 class="title">
        RUGBY LIVE
        <span>SCORE</span>
      </h1>
    </div>

    <div class="bottom">

      <div class="age-groups">
        <a class="age-btn" href="/live.html?team=U13">U13's</a>
        <a class="age-btn" href="/live.html?team=U14">U14's</a>
        <a class="age-btn" href="/live.html?team=U15">U15's</a>
        <a class="age-btn live" href="/live.html?team=U16">U16's</a>
        <a class="age-btn" href="/live.html?team=Colts">Colts</a>
        <a class="age-btn" href="/live.html?team=1stXV">1st XV</a>
        <a class="age-btn" href="/live.html?team=2ndXV">2nd XV</a>
      </div>

      <div class="install-wrap">
  <button id="installApp">Install Rugby LIVE</button>
</div>
      <div class="bottom-space"></div>

    </div>

  </main>

</body>
</html>
