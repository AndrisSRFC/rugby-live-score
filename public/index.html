<!doctype html>
<html lang="en">
<head>
  <meta name="theme-color" content="#050505">
  <link rel="manifest" href="/live-manifest.json">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rugby LIVE</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="broadcast">Broadcast<br><strong>Andris Sudmalis</strong></div>
  <div class="live-corner" id="liveCorner">LIVE</div>
  <button id="installApp" style="display:none;">📱 Install Rugby LIVE</button>
<div class="wrap">
  <main class="card">
    

    <section class="board">
      <div class="center-info">
  <div class="vs" id="ageGroup">U13</div>
  <div class="match-type" id="matchType">Friendly</div>
        <div class="center-line"></div>
        <div class="top">
  <div class="clock" id="clock">40:00</div>
  <div class="half"><span id="half">1</span><span id="halfSuffix">st</span><span id="halfWord"> Half</span></div>
          <div class="center-line"></div>
</div>
        </div>
      <div class="team">
        <div class="name" id="homeName">Team 1</div>
        <div class="score" id="homeScore">0</div>
      </div>
      

      <div class="team">
        <div class="name" id="awayName">Team 2</div>
        <div class="score" id="awayScore">0</div>
      </div>
    </section>

  <div id="nextLiveBox" class="next-live"></div></main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);

function fmt(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
}

function render(s) {
  $('homeName').textContent = s.homeName;
  $('awayName').textContent = s.awayName;
  $('homeScore').textContent = s.homeScore;
  $('awayScore').textContent = s.awayScore;
  $('half').textContent = s.matchLive ? s.half : 'Full Time';
  $('halfSuffix').textContent = s.matchLive ? (s.half === 1 ? 'st' : 'nd') : '';
  $('halfWord').textContent = s.matchLive ? ' Half' : '';
  $('clock').textContent = fmt(s.remainingSeconds);
  const age = s.ageGroup || 'U13';
$('ageGroup').textContent = ['U13','U14','U15','U16'].includes(age) ? age + "'s" : age;
$('matchType').textContent = (s.matchType || 'Friendly').toUpperCase() + ' GAME';
  $('liveCorner').style.display = s.matchLive ? 'block' : 'none';
 $('nextLiveBox').innerHTML = (s.nextLive)
  ? '<div class="next-title">Planned Live:</div>' +
    '<div class="next-card">' +
      '<div class="next-icon">🗓️</div>' +
      '<div>' +
        '<div class="next-teams">' + s.nextHome + ' vs ' + s.nextAway + '</div>' +
        '<div class="next-details">' + (['U13','U14','U15','U16'].includes(s.nextAge) ? s.nextAge + "'s" : s.nextAge) + ' ' + (s.nextType || 'Friendly').toUpperCase() + ' GAME</div>' +
        '<div class="next-time">' + s.nextLive + '</div>' +
   '<div class="next-note">Subject to availability</div>' +
      '</div>' +
    '</div>'
  : '';
}

fetch('/api/state').then(r=>r.json()).then(render);
const socket = io();
  navigator.serviceWorker.register('/sw.js');
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    $('installApp').style.display = 'block';
    });
  $('installApp').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt = null;
    $('installApp').style.display = 'none';
    });
socket.on('state', render);
</script>
</body>
</html>
